# file: ./.github/workflows/deploy-docs.yml
# description: deploy-docs - builds the VitePress docs site in site-wiki/ and deploys it to GitHub Pages on every push to main that touches the site. Runs only in the community repo, where this folder sits at the repo root; the private monorepo never sees it. Adapted from the official VitePress GitHub Pages workflow (Pages source must be set to "GitHub Actions").
# scope: project
# updated-at: 2026-09-18
name: Deploy docs site

on:
  push:
    branches: [main]
    paths:
      - "site-wiki/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install
        run: npm ci
        working-directory: site-wiki
      - name: Build
        run: npm run docs:build
        working-directory: site-wiki
      - name: Set up Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-wiki/.vitepress/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
